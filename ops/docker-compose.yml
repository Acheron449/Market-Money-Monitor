name: smart-money-monitor

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smm}
      POSTGRES_DB: smm
    volumes:
      - smm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smm -d smm"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../backend
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://smm:${POSTGRES_PASSWORD:-smm}@db:5432/smm
      SEC_USER_AGENT: ${SEC_USER_AGENT:?set SEC_USER_AGENT in ops/.env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in ops/.env}
      ALPACA_KEY_ID: ${ALPACA_KEY_ID:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_FEED: ${ALPACA_FEED:-iex}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      CONFIG_FILE: /app/smm.yaml
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    volumes:
      - ../smm.yaml:/app/smm.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ../frontend
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  smm-db:
